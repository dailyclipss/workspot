workflows:
  android-release:
    name: Android Release
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - workspot_upload
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build AAB
        script: |
          flutter build appbundle --release \
            --build-number=$BUILD_NUMBER
    artifacts:
      - build/app/outputs/bundle/release/*.aab
  ios-release:
    name: iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Workspot.az
    environment:
      groups:
        - signing
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        BUNDLE_ID: az.workspot.app
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install pods
        script: |
          cd ios
          pod install
      - name: Set up code signing
        script: |
          set -e
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          xcode-project use-profiles
          echo "--- installed profiles ---"
          ls -la "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          echo "--- pbxproj signing settings ---"
          grep -nE "CODE_SIGN|PROVISIONING|DEVELOPMENT_TEAM" ios/Runner.xcodeproj/project.pbxproj
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
